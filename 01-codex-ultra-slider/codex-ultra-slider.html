function pointer(e){const r=track.getBoundingClientRect(),z=r.height/28;setPosition(400*(e.clientX-offset-r.left-13*z)/(r.width-26*z))}
let offset=0;
track.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();input.focus();dragging=true;track.classList.add("held");spring(true);
  const box=knob.getBoundingClientRect();offset=e.target===knob?e.clientX-(box.left+box.width/2):0;
  track.setPointerCapture(e.pointerId);pointer(e)};
track.onpointermove=e=>{if(dragging)pointer(e)};
track.onlostpointercapture=e=>{if(dragging){dragging=false;track.classList.remove("held");setPosition(level*100);spring(e.pointerType!=="touch"&&document.elementFromPoint(e.clientX,e.clientY)===knob);save()}};
input.oninput=()=>setPosition(Number(input.value));
input.onkeydown=e=>{const steps={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1,Home:-4,End:4};if(e.key in steps){e.preventDefault();setPosition(100*(level+steps[e.key]));save()}};
$(".reset").onclick=()=>{setPosition(400);toggle(false);save()};$(".speed").onclick=()=>{toggle(!fast);save()};
new ResizeObserver(()=>{$(".panel").style.zoom=Math.min(1,(root.clientWidth-20)/254)}).observe(root);
document.addEventListener("visibilitychange",animate);motion.addEventListener("change",animate);
window.addEventListener("openai:set_globals",e=>restore(e.detail?.globals?.widgetState));
setPosition(100,false);restore(window.openai?.widgetState);
})();
</script>
