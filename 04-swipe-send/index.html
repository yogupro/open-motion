<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030207">
  <title>上滑转账</title>
  <link rel="stylesheet" href="./screen.css">
  <link rel="stylesheet" href="./receipt.css">
  <script defer src="./renderer.js"></script>
  <script defer src="./receipt.js"></script>
  <script defer src="./motion.js"></script>
</head>
<body>
  <main class="scene" aria-label="上滑转账动效演示">
    <div class="device">
      <div class="screen" data-phase="review">
        <canvas class="light-field" aria-hidden="true"></canvas>
        <div class="camera" aria-hidden="true"></div>
        <section class="review" aria-labelledby="review-heading">
          <h1 id="review-heading">确认转账</h1>
          <div class="identity">
            <img src="./lin-yue.png" class="avatar" width="64" height="64" alt="">
            <p class="recipient">转给 <strong>林悦</strong></p>
            <p class="amount">¥240.00</p>
            <p class="memo">周五晚餐</p>
          </div>
          <dl class="details">
            <div><dt>付款方式</dt><dd>账户余额</dd></div>
            <div><dt>手续费</dt><dd>免收</dd></div>
            <div><dt>到账时间</dt><dd>即时到账</dd></div>
          </dl>
          <div class="rail-outline" aria-hidden="true"></div>
          <span class="release-hint" aria-hidden="true">松手确认转账</span>
          <button class="swipe" type="button" aria-label="上滑转账，也可以按回车键确认">
            <svg width="16" height="18" viewBox="0 0 16 18" fill="none" aria-hidden="true">
              <path d="M8 15V3M2.8 8.1 8 2.8l5.2 5.3" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            上滑转账
          </button>
        </section>
        <div class="sending-label" aria-hidden="true"><span></span></div>
        <section class="receipt" aria-label="转账回执" hidden></section>
        <div class="sr-only" role="status" aria-live="polite"></div>
      </div>
    </div>
  </main>
</body>
</html>
