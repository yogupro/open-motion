<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>进度线的暂停与回弹</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: #f2f3f6; font: 15px/1.4 system-ui, sans-serif }
  main { width: min(100%, 780px) }
  section { --ink: #fff; --back: #2d48f7; --fill: #3853f5; height: clamp(244px, 52vw, 390px); position: relative; isolation: isolate; overflow: hidden; border-radius: 18px; color: var(--ink); background: var(--back); display: grid; grid-template-rows: 1fr auto 1fr; place-items: center; transition: background-color .2s, color .2s }
  section.paused { --ink: #231706; --back: #f49e2e; --fill: #e4932a }
  .fill { position: absolute; inset: 0; z-index: -1; background: var(--fill); transform-origin: left; transform: scaleX(0); transition: background-color .2s }
  output { align-self: end; font-size: clamp(34px, 7vw, 54px); font-variant-numeric: tabular-nums; line-height: 1; font-weight: 550; letter-spacing: -.04em }
  output span { opacity: .55 }
  .track { width: 100%; height: clamp(72px, 12vw, 110px); overflow: hidden }
  .line { stroke: currentColor; stroke-width: 10; stroke-linejoin: round; stroke-linecap: round; fill: none }
  button { font: inherit; cursor: pointer }
  .toggle { align-self: start; width: 48px; height: 48px; border: 0; border-radius: 50%; display: grid; place-items: center; color: inherit; background: transparent }
  .toggle svg { width: 34px; height: 34px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linejoin: round; stroke-linecap: round }
  .toggle:focus-visible { outline: 2px solid currentColor }
  footer { display: flex; align-items: center; justify-content: space-between; margin: 12px 4px; color: #434655 }
  footer button { background: transparent; color: inherit; border: 0; padding: 6px 8px }
  @media (prefers-reduced-motion: reduce) { section, .fill { transition: none } }
</style>
<main>
  <section aria-label="进度动画示例">
    <div class="fill"></div>
    <output aria-hidden="true"><b>0</b><span>%</span></output>
    <svg class="track" viewBox="0 -65 960 130" preserveAspectRatio="none" role="progressbar" aria-label="当前进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <path class="line"></path>
    </svg>
    <button class="toggle" aria-label="暂停"><svg viewBox="0 0 24 24" aria-hidden="true"><g id="pause"><circle cx="12" cy="12" r="9"/><path d="M10 9v6m4-6v6"/></g><g id="resume" style="display:none"><path d="M3 4v5h5M3.7 8.5A8.7 8.7 0 0 1 20 9m1 11v-5h-5m4.3.5A8.7 8.7 0 0 1 4 15"/></g></svg></button>
  </section>
  <footer><span role="status">自动演示</span><button class="replay">重新播放</button></footer>
</main>
<script>
const $ = selector => document.querySelector(selector);
const panel = $("section"), line = $(".line"), fill = $(".fill"), toggle = $(".toggle");
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
const steps = [{ at: .318, hold: .99 }, { at: .819, hold: 1.32 }];
let progress, speed, paused, automatic, nextStep, resumeTime, frameId, lastTime;
// Keep the midpoint of the main crest and trough fixed in track coordinates on release.
let releaseAnchor = null;
const mainMidpoint = -10.5;
const waves = [
  { x: -45, y: 0 },
  { x: -21, y: -37, releaseRate: 18.8, value: 0, velocity: 0 },
  { x: 0, y: 37, releaseRate: 20.8, value: 0, velocity: 0 },
  { x: 21, y: -17, releaseRate: 23.5, value: 0, velocity: 0 },
  { x: 42, y: 0 }
];
const movingKnots = waves.filter(knot => knot.y !== 0);
// Center is measured from the line cap; width scales the knot spacing.
const foldCenter = { value: -157, velocity: 0 };
const foldWidth = { value: 3.18, velocity: 0 };

// Closed-form damped spring. Its state carries over when the user changes direction.
function advanceSpring(spring, target, dt, stiffness, damping) {
  const decayRate = damping / 2;
  const frequency = Math.sqrt(stiffness - decayRate * decayRate);
  const distance = spring.value - target;
  const envelope = Math.exp(-decayRate * dt);
  const cosine = Math.cos(frequency * dt);
  const sineOverFrequency = Math.sin(frequency * dt) / frequency;
  const velocity = spring.velocity;
  spring.value = target + envelope * (distance * cosine + (velocity + decayRate * distance) * sineOverFrequency);
  spring.velocity = envelope * (velocity * cosine - (decayRate * velocity + stiffness * distance) * sineOverFrequency);
}

// Each crest and valley has one horizontal tangent, shared by its two neighboring arcs.
function valleyAt(end, width) {
  return releaseAnchor === null ? end + foldCenter.value : releaseAnchor - mainMidpoint * width;
}
function pathAt(end) {
  const width = Math.max(.30, foldWidth.value);
  const center = valleyAt(end, width);
  const xAt = x => center + x * width;
  // Short handles give the released ripple a gentle slope; long handles form
  // the upright sides of the paused knot. Blend without a corner at either end.
  const height = Math.max(...movingKnots.map(knot => Math.abs(knot.y * knot.value))) / 37;
  const tightness = Math.max(0, Math.min(1, height, (3.45 - width) / 2.45));
  const blend = tightness * tightness * (3 - 2 * tightness);
  const handleFraction = 1 / 3 + (.87 - 1 / 3) * blend;
  const commands = ['M -6 0', 'L ' + xAt(waves[0].x) + ' 0'];
  for (let i = 1; i < waves.length; i++) {
    const left = waves[i - 1], right = waves[i];
    const x1 = xAt(left.x), x2 = xAt(right.x);
    const y1 = left.y * (left.value ?? 0), y2 = right.y * (right.value ?? 0);
    const handle = (x2 - x1) * handleFraction;
    commands.push(`C ${x1 + handle} ${y1} ${x2 - handle} ${y2} ${x2} ${y2}`);
  }
  commands.push('L ' + end + ' 0');
  return commands.join(' ');
}
function paint() {
  const end = 960 * progress;
  line.setAttribute('d', pathAt(end));
  fill.style.transform = 'scaleX(' + progress + ')';
  const value = Math.floor(progress * 100);
  $('output b').textContent = value;
  $('.track').setAttribute('aria-valuenow', value);
}
function setPaused(value) {
  const end = progress * 960;
  const width = Math.max(.30, foldWidth.value);
  if (!value && paused) {
    releaseAnchor = end + foldCenter.value + mainMidpoint * width;
  } else if (value && releaseAnchor !== null) {
    // A second pause can arrive halfway through unfolding. Start at the drawn pose.
    foldCenter.value = valleyAt(end, width) - end;
    foldCenter.velocity = -mainMidpoint * foldWidth.velocity;
    releaseAnchor = null;
  }
  paused = value;
  if (paused) speed = 0;
  panel.classList.toggle('paused', value);
  $('#pause').style.display = value ? 'none' : '';
  $('#resume').style.display = value ? '' : 'none';
  toggle.setAttribute('aria-label', value ? '继续' : '暂停');
}
function tick(now) {
  const dt = Math.min(.04, (now - lastTime) / 1000);
  lastTime = now;
  if (!paused) {
    const cruise = .35, ramp = .09;
    const decay = Math.exp(-dt / ramp);
    const distance = cruise * dt - (cruise - speed) * ramp * (1 - decay);
    speed = cruise - (cruise - speed) * decay;
    progress = Math.min(1, progress + distance);
    const step = steps[nextStep];
    if (automatic && step && progress >= step.at) {
      progress = step.at;
      resumeTime = now + 1000 * step.hold;
      nextStep++;
      setPaused(true);
    }
  } else if (automatic && now >= resumeTime) {
    setPaused(false);
  }
  const target = paused ? 1 : 0;
  const centerTarget = paused ? -90 : -157;
  let widthTarget = paused ? 1 : 3.18;
  if (releaseAnchor !== null) {
    // Only spread as far as the moving cap allows; leave a short straight tail.
    const rightSpan = waves[waves.length - 1].x - mainMidpoint;
    widthTarget = Math.min(3.45, (960 * progress - releaseAnchor - 5) / rightSpan);
  }
  if (reduce.matches) {
    for (const knot of movingKnots) { knot.value = target; knot.velocity = 0 }
    foldCenter.value = centerTarget;
    foldWidth.value = widthTarget;
    foldCenter.velocity = foldWidth.velocity = 0;
  } else {
    for (const knot of movingKnots) {
      const stiffness = paused ? 295 : knot.releaseRate ** 2;
      const damping = paused ? 12.7 : .88 * knot.releaseRate;
      advanceSpring(knot, target, dt, stiffness, damping);
    }
    advanceSpring(foldCenter, centerTarget, dt, paused ? 275 : 380, paused ? 13 : 23);
    advanceSpring(foldWidth, widthTarget, dt, paused ? 280 : 380, paused ? 13.3 : 23);
  }
  const rippleVisible = movingKnots.some(knot =>
    Math.abs(knot.value) > .002 || Math.abs(knot.velocity) > .04
  );
  if (releaseAnchor !== null && !rippleVisible) {
    // All knots are subpixel now. Straighten before rearming for the next fold.
    for (const knot of movingKnots) { knot.value = 0; knot.velocity = 0 }
    releaseAnchor = null;
    foldCenter.value = -157;
    foldWidth.value = 3.18;
    foldCenter.velocity = foldWidth.velocity = 0;
  }
  paint();
  if (progress < 1 || rippleVisible) frameId = requestAnimationFrame(tick);
  else {
    toggle.disabled = true;
    toggle.style.visibility = 'hidden';
    $('[role=status]').textContent = '已完成';
  }
}
function replay() {
  cancelAnimationFrame(frameId);
  progress = nextStep = 0;
  speed = .35;
  for (const knot of movingKnots) { knot.value = 0; knot.velocity = 0 }
  foldCenter.value = -157;
  foldWidth.value = 3.18;
  foldCenter.velocity = foldWidth.velocity = 0;
  paused = false; releaseAnchor = null;
  automatic = true; setPaused(false);
  toggle.disabled = false; toggle.style.visibility = '';
  $('[role=status]').textContent = '自动演示';
  lastTime = performance.now(); paint(); frameId = requestAnimationFrame(tick);
}
toggle.onclick = () => {
  automatic = false; setPaused(!paused);
  $('[role=status]').textContent = paused ? '已暂停' : '进行中';
};
$('.replay').onclick = replay;
replay();
</script>
</html>
