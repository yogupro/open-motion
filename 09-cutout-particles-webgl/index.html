<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>抠图粒子消散与高光描边 · WebGL</title>
  <style>
    :root {
      --bg: #0c0d10;
      --surface: rgba(24, 25, 29, 0.78);
      --surface-hover: rgba(38, 40, 46, 0.9);
      --border: rgba(255, 255, 255, 0.1);
      --border-strong: rgba(255, 255, 255, 0.18);
      --text: #f3f4f6;
      --text-dim: #9ca3af;
      --accent: #f6c453;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --font-sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(ellipse 75% 65% at 50% 42%, #1d1e24 0%, #0e0f13 62%, #090a0d 100%);
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .scene {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px 24px 24px;
    }

    /* Stage Card */
    .stage-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    .card-stage {
      position: relative;
      height: min(100%, 620px);
      aspect-ratio: 3 / 4;
      max-width: 100%;
      border-radius: 26px;
      overflow: hidden;
      background: rgb(176, 170, 156);
      box-shadow:
        0 32px 80px rgba(0, 0, 0, 0.58),
        0 0 0 1px rgba(255, 255, 255, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 220ms var(--ease), box-shadow 220ms var(--ease);
    }

    .card-stage:active {
      transform: scale(0.992);
    }

    /* Layer 1: Original Photo (fades out cleanly once WebGL dust begins) */
    .layer-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      will-change: opacity;
    }

    /* Layer 2: WebGL2 Instanced Sticker-Tile Dissolve */
    .layer-dust {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Layer 3: Die-Cut White Sticker Stroke + Foreground Subject */
    .subject-group {
      position: absolute;
      inset: 0;
      pointer-events: none;
      transform-origin: 50% 62%;
      will-change: transform;
    }

    .layer-edge {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.34));
    }

    .layer-subject {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    /* Layer 4: WebGL2 Dual-Layer Highlight Outline Shimmer */
    .layer-spark {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Subtle HUD badge inside top-left of card */
    .phase-pill {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 6;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 28px;
      padding: 0 11px;
      border-radius: 999px;
      background: rgba(12, 13, 16, 0.56);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.92);
      letter-spacing: 0.01em;
      pointer-events: none;
    }

    .phase-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px rgba(246, 196, 83, 0.8);
      transition: background-color 200ms var(--ease), box-shadow 200ms var(--ease);
    }

    .phase-pill[data-phase="identifying"] .phase-dot {
      background: #60a5fa;
      box-shadow: 0 0 8px rgba(96, 165, 250, 0.85);
    }

    .phase-pill[data-phase="result"] .phase-dot {
      background: #4ade80;
      box-shadow: 0 0 8px rgba(74, 222, 128, 0.85);
    }

    .tap-hint {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(12, 13, 16, 0.52);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.78);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 220ms var(--ease);
    }

    .card-stage:hover .tap-hint {
      opacity: 1;
    }

    /* Bottom Dock Controls */
    .dock {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 16px;
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.36);
      flex: none;
    }

    .seg {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .seg button,
    .chip-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 12px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 150ms var(--ease), color 150ms var(--ease), transform 120ms var(--ease);
    }

    .seg button:hover,
    .chip-btn:hover {
      color: var(--text);
    }

    .seg button:active,
    .chip-btn:active {
      transform: scale(0.97);
    }

    .seg button[aria-pressed="true"] {
      background: rgba(255, 255, 255, 0.13);
      color: var(--text);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .divider {
      width: 1px;
      height: 20px;
      background: var(--border);
    }

    .chip-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
    }

    .chip-btn[aria-pressed="true"] {
      background: rgba(246, 196, 83, 0.14);
      border-color: rgba(246, 196, 83, 0.35);
      color: #fde68a;
    }

    .chip-btn.action {
      background: rgba(255, 255, 255, 0.92);
      border-color: transparent;
      color: #0e0f13;
    }

    .chip-btn.action:hover {
      background: #ffffff;
      color: #0e0f13;
    }

    .stats {
      font-family: var(--font-mono);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--text-dim);
      padding: 0 6px;
    }

    .fallback-banner {
      position: absolute;
      inset: auto 16px 16px 16px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(20, 20, 24, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.14);
      font-size: 12px;
      color: var(--text-dim);
      text-align: center;
      display: none;
    }

    @media (max-width: 680px) {
      .scene {
        padding: 12px 12px 14px;
        gap: 12px;
      }
      .divider,
      .stats {
        display: none;
      }
      .dock {
        padding: 6px 8px;
        gap: 6px;
      }
      .seg button,
      .chip-btn {
        padding: 0 9px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="WebGL 抠图粒子消散与高光描边演示">
    <div class="stage-wrap">
      <div class="card-stage" id="card-stage" role="button" tabindex="0" aria-label="点击触发抠图粒子消散或重播">
        <img class="layer-photo" id="layer-photo" src="./assets/photo.jpg" alt="柠檬原图" draggable="false" />
        <canvas class="layer-dust" id="layer-dust" aria-hidden="true"></canvas>

        <div class="subject-group" id="subject-group">
          <svg class="layer-edge" id="layer-edge" viewBox="0 0 960 1280" preserveAspectRatio="none" aria-hidden="true">
            <path
              id="edge-path"
              fill="none"
              stroke="#ffffff"
              stroke-width="0"
              stroke-linejoin="round"
              stroke-linecap="round"
            />
          </svg>
          <img class="layer-subject" id="layer-subject" src="./assets/subject.png" alt="抠出主体" draggable="false" />
        </div>

        <canvas class="layer-spark" id="layer-spark" aria-hidden="true"></canvas>

        <div class="phase-pill" id="phase-pill" data-phase="preview" aria-live="polite">
          <span class="phase-dot" aria-hidden="true"></span>
          <span id="phase-label">高光描边 · 待确认</span>
        </div>
        <div class="tap-hint" id="tap-hint">点击画面确认抠图 · Space 切换</div>
        <div class="fallback-banner" id="fallback-banner">当前环境不支持 WebGL 2，已降级为静态主体展示</div>
      </div>
    </div>

    <div class="dock" role="toolbar" aria-label="动效控制">
      <button type="button" class="chip-btn action" id="btn-primary">✓ 确认抠图</button>
      <span class="divider" aria-hidden="true"></span>
      <button type="button" class="chip-btn" id="toggle-loop" aria-pressed="true">自动循环</button>
      <span class="divider" aria-hidden="true"></span>
      <span class="stats" id="stats-label">WebGL2 · 0 tiles</span>
    </div>
  </main>

  <script type="module">
    import { createCutoutController, computeAverageColor } from './engine.js';

    const cardStage = document.getElementById('card-stage');
    const photoEl = document.getElementById('layer-photo');
    const dustCanvas = document.getElementById('layer-dust');
    const sparkCanvas = document.getElementById('layer-spark');
    const subjectGroup = document.getElementById('subject-group');
    const edgePath = document.getElementById('edge-path');
    const phasePill = document.getElementById('phase-pill');
    const phaseLabel = document.getElementById('phase-label');
    const tapHint = document.getElementById('tap-hint');
    const statsLabel = document.getElementById('stats-label');
    const fallbackBanner = document.getElementById('fallback-banner');

    const primaryBtn = document.getElementById('btn-primary');
    const toggleLoopBtn = document.getElementById('toggle-loop');

    const PHASE_TEXT = {
      preview: '高光描边 · 待确认',
      identifying: '粒子消散中',
      result: '贴纸成型'
    };

    function waitImage(img) {
      if (img.complete && img.naturalWidth > 0) return Promise.resolve(img);
      return new Promise((resolve, reject) => {
        img.addEventListener('load', () => resolve(img), { once: true });
        img.addEventListener('error', reject, { once: true });
      });
    }

    async function boot() {
      const [contourData] = await Promise.all([
        fetch('./assets/contour.json').then((r) => r.json()),
        waitImage(photoEl)
      ]);

      // Apply authentic CIAreaAverage backdrop color
      const avg = computeAverageColor(photoEl);
      cardStage.style.background = avg.css;

      // Build SVG white die-cut outline path in 960x1280 native photo space
      const W = contourData.width || 960;
      const H = contourData.height || 1280;
      const d =
        'M' +
        contourData.points
          .map(([u, v]) => `${(u * W).toFixed(1)} ${(v * H).toFixed(1)}`)
          .join('L') +
        'Z';
      edgePath.setAttribute('d', d);

      // Authentic stroke width: 14pt on 300pt longest side -> scaled to 1280px longest side
      const maxStrokeWidth = (14 * Math.max(W, H)) / 300;

      let lastTileCount = -1;
      const controller = createCutoutController({
        dustCanvas,
        sparkCanvas,
        photoImg: photoEl,
        contourPoints: contourData.points,
        onPhaseChange(phase) {
          phasePill.dataset.phase = phase;
          phaseLabel.textContent = PHASE_TEXT[phase] || phase;
          if (phase === 'preview') {
            primaryBtn.textContent = '✓ 确认抠图';
            tapHint.textContent = '点击画面确认抠图 · Space 切换';
          } else {
            primaryBtn.textContent = '↺ 重新演示';
            tapHint.textContent = '点击画面重新开始 · Space 切换';
          }
        },
        onFrame({ photoOpacity, lift, edgeProgress, tileCount }) {
          photoEl.style.opacity = photoOpacity.toFixed(3);

          // Match CaptureView.swift subject rise into upper-center showcase position
          const scale = 1 + lift * 0.025;
          const ty = -lift * 52;
          subjectGroup.style.transform = `translate3d(0, ${ty.toFixed(2)}px, 0) scale(${scale.toFixed(4)})`;

          const sw = Math.max(0, edgeProgress) * maxStrokeWidth;
          edgePath.setAttribute('stroke-width', sw.toFixed(2));
          edgePath.style.opacity = sw > 0.2 ? '1' : '0';

          if (tileCount !== lastTileCount) {
            lastTileCount = tileCount;
            statsLabel.textContent = `WebGL2 · ${tileCount} tiles`;
          }
        }
      });

      if (!controller.webglSupported) {
        fallbackBanner.style.display = 'block';
      }

      const ro = new ResizeObserver((entries) => {
        const rect = entries[0]?.contentRect;
        if (rect && rect.width > 0 && rect.height > 0) {
          controller.resize(rect.width, rect.height);
        }
      });
      ro.observe(cardStage);

      let loopOn = true;
      toggleLoopBtn.addEventListener('click', () => {
        loopOn = !loopOn;
        toggleLoopBtn.setAttribute('aria-pressed', String(loopOn));
        controller.update({ autoLoop: loopOn });
      });

      primaryBtn.addEventListener('click', () => {
        controller.primaryAction();
      });

      cardStage.addEventListener('click', () => {
        controller.primaryAction();
      });

      cardStage.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          controller.primaryAction();
        }
      });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && document.activeElement !== cardStage) {
          e.preventDefault();
          controller.primaryAction();
        }
      });

      window.addEventListener('beforeunload', () => {
        ro.disconnect();
        controller.destroy();
      });
    }

    boot().catch((err) => {
      console.error(err);
      fallbackBanner.textContent = `加载失败: ${err.message}`;
      fallbackBanner.style.display = 'block';
    });
  </script>
</body>
</html>
